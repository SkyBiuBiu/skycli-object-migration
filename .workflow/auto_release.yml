version: '1.0'
name: auto_release
displayName: auto_release
triggers:
  trigger: auto
  push:
    tags:
      prefix:
        - ''
stages:
  - name: auto_release
    displayName: auto_release
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: release@gitee
        name: release_gitee
        displayName: Gitee Release
        releaseName: null
        description: test
        tagName: test
        upstreamArtifact: []
        assertFiles: null
        prerelease: false
        allowUpdate: true
        notify: []
        strategy:
          retry: '0'
