[pytest]
markers =
    moto: use moto mock S3
    real_s3: use real S3 service
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 默认只运行 moto 测试
addopts = -m "moto or not real_s3" -v
